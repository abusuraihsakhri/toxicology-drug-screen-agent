name: Python and browser regression tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project
        run: python -m pip install -e '.[api,test]'
      - name: Python syntax check
        run: python -m compileall -q agents toxicology_drug_screen_agent cli.py tox_screen_agent.py enrichment.py simulator.py
      - name: Python tests
        run: python -m pytest -q
      - name: Installed CLI smoke test
        run: toxicology-drug-screen-engine audit --case-id CI-001 --primary 1 --secondary 1 --status NORMAL
      - name: Browser tests
        run: |
          node --check web/app.js
          node web/test_app.cjs
