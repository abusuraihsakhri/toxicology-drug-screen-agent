[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toxicology-drug-screen-agent"
version = "2.0.0"
description = "ToxScreen Sentinel: Immunoassay Cross-Reactivity & Confirmatory LC-MS/MS Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.100", "uvicorn>=0.23"]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["agents", "toxicology_drug_screen_agent"]
py-modules = ["cli", "tox_screen_agent", "enrichment", "simulator", "tox_screen_agent_app", "toxicology_drug_screen_agent_app"]

[tool.pytest.ini_options]
testpaths = ["tests", "test_tox_screen_agent.py"]

[project.scripts]
toxicology-drug-screen-engine = "toxicology_drug_screen_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/toxicology-drug-screen-engine"
Repository = "https://github.com/abusuraihsakhri/toxicology-drug-screen-agent.git"
